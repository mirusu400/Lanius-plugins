name: Deploy catalogue

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out Lanius SDK
        uses: actions/checkout@v6
        with:
          repository: mirusu400/Lanius
          path: .lanius
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate against current Lanius
        env:
          PYTHONPATH: ${{ github.workspace }}/.lanius/engine
        run: |
          python tools/build_catalogue.py --check
          pytest -q
      - name: Build signed catalogue
        env:
          LANIUS_PACKAGE_SIGNING_KEY: ${{ secrets.LANIUS_PACKAGE_SIGNING_KEY }}
          LANIUS_CATALOGUE_SIGNING_KEY: ${{ secrets.LANIUS_CATALOGUE_SIGNING_KEY }}
        run: >-
          python tools/build_catalogue.py
          --output dist
          --previous-url https://mirusu400.github.io/Lanius-plugins/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
